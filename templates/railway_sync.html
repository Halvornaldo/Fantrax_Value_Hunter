<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Database Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        .sync-panel {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .button-container {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .btn-primary {
            background: #0ea5e9;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.3);
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover:not(:disabled) {
            background: #dc2626;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-message {
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 500;
        }
        .status-idle { background: #f3f4f6; color: #6b7280; }
        .status-syncing { background: #dbeafe; color: #1e40af; }
        .status-success { background: #d1fae5; color: #065f46; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .progress-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .progress-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e9ecef;
        }
        .progress-table td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }
        .progress-table tr:hover {
            background: #f8f9fa;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-starting { background: #e0e7ff; color: #3730a3; }
        .badge-backing-up { background: #fef3c7; color: #92400e; }
        .badge-syncing { background: #dbeafe; color: #1e40af; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-error { background: #fee2e2; color: #991b1b; }
        .progress-bar-container {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9, #3b82f6);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .log-container {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            padding: 2px 0;
            color: #374151;
        }
        .log-entry.error {
            color: #dc2626;
            font-weight: bold;
        }
        .summary-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .summary-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .summary-value {
            font-size: 36px;
            font-weight: bold;
            color: #0ea5e9;
            margin-bottom: 5px;
        }
        .summary-label {
            color: #6b7280;
            font-size: 14px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f4f6;
            border-radius: 50%;
            border-top-color: #0ea5e9;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Railway Database Sync</h1>
            <p class="subtitle">Sync your local Fantrax Value Hunter database to Railway cloud</p>
        </div>

        <div class="sync-panel">
            <div class="button-container">
                <button id="startSync" class="btn btn-primary" onclick="startSync()">
                    Start Railway Sync
                </button>
                <button id="abortSync" class="btn btn-danger" onclick="abortSync()" disabled>
                    Abort Sync
                </button>
                <div id="statusMessage" class="status-message status-idle">
                    Ready to sync 16 tables to Railway
                </div>
            </div>

            <div id="summaryContainer" class="summary-container" style="display: none;">
                <div class="summary-card">
                    <div class="summary-value" id="tablesCompleted">0</div>
                    <div class="summary-label">Tables Completed</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="rowsSynced">0</div>
                    <div class="summary-label">Total Rows Synced</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="errorCount">0</div>
                    <div class="summary-label">Errors</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="elapsedTime">0:00</div>
                    <div class="summary-label">Elapsed Time</div>
                </div>
            </div>

            <table class="progress-table" id="progressTable">
                <thead>
                    <tr>
                        <th>Table Name</th>
                        <th>Status</th>
                        <th>Progress</th>
                        <th>Rows</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Tables will be added dynamically -->
                </tbody>
            </table>

            <div class="log-container" id="logContainer" style="display: none;">
                <h3>Sync Log</h3>
                <div id="logEntries"></div>
            </div>
        </div>
    </div>

    <script>
        let syncId = null;
        let progressInterval = null;
        let startTime = null;
        let timeInterval = null;

        const TABLES = [
            'players', 'player_metrics', 'player_games_data', 'team_metrics',
            'name_mappings', 'player_form', 'player_game_scores', 'team_fixtures',
            'understat_name_mappings', 'raw_player_snapshots', 'raw_form_snapshots',
            'raw_fixture_snapshots', 'clean_player_game_scores', 'fixture_odds',
            'verified_name_mappings', 'raw_data_complete'
        ];

        function initializeTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            TABLES.forEach(table => {
                const row = document.createElement('tr');
                row.id = `row-${table}`;
                row.innerHTML = `
                    <td><strong>${table}</strong></td>
                    <td><span class="status-badge badge-pending">Pending</span></td>
                    <td>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: 0%"></div>
                        </div>
                    </td>
                    <td>0 / 0</td>
                    <td>-</td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateTableRow(table, data) {
            const row = document.getElementById(`row-${table}`);
            if (!row) return;

            const statusCell = row.cells[1];
            const progressCell = row.cells[2];
            const rowsCell = row.cells[3];
            const messageCell = row.cells[4];

            // Update status badge
            let badgeClass = 'badge-pending';
            let statusText = 'Pending';

            switch(data.status) {
                case 'starting':
                    badgeClass = 'badge-starting';
                    statusText = 'Starting';
                    break;
                case 'backing_up':
                    badgeClass = 'badge-backing-up';
                    statusText = 'Backing Up';
                    break;
                case 'syncing':
                    badgeClass = 'badge-syncing';
                    statusText = 'Syncing';
                    break;
                case 'success':
                    badgeClass = 'badge-success';
                    statusText = 'Success';
                    break;
                case 'error':
                    badgeClass = 'badge-error';
                    statusText = 'Error';
                    break;
            }

            statusCell.innerHTML = `<span class="status-badge ${badgeClass}">${statusText}</span>`;

            // Update progress bar
            const progress = data.total_rows > 0
                ? Math.round((data.rows_synced / data.total_rows) * 100)
                : 0;

            const progressBar = progressCell.querySelector('.progress-bar');
            progressBar.style.width = `${progress}%`;
            if (progress > 0) {
                progressBar.textContent = `${progress}%`;
            }

            // Update rows
            rowsCell.textContent = `${data.rows_synced || 0} / ${data.total_rows || 0}`;

            // Update message
            messageCell.textContent = data.message || '-';
        }

        function updateSummary(results) {
            let tablesCompleted = 0;
            let totalRows = 0;
            let errors = 0;

            Object.values(results).forEach(result => {
                if (result.status === 'success') tablesCompleted++;
                if (result.status === 'error') errors++;
                totalRows += result.rows_synced || 0;
            });

            document.getElementById('tablesCompleted').textContent = tablesCompleted;
            document.getElementById('rowsSynced').textContent = totalRows.toLocaleString();
            document.getElementById('errorCount').textContent = errors;
        }

        function updateElapsedTime() {
            if (!startTime) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('elapsedTime').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function addLogEntry(message, isError = false) {
            const logEntries = document.getElementById('logEntries');
            const entry = document.createElement('div');
            entry.className = `log-entry ${isError ? 'error' : ''}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEntries.appendChild(entry);
            logEntries.scrollTop = logEntries.scrollHeight;
        }

        async function startSync() {
            if (!confirm('Are you sure you want to sync all tables to Railway? This will replace all data on Railway.')) {
                return;
            }

            // Initialize UI
            initializeTable();
            document.getElementById('startSync').disabled = true;
            document.getElementById('abortSync').disabled = false;
            document.getElementById('statusMessage').className = 'status-message status-syncing';
            document.getElementById('statusMessage').innerHTML = '<span class="spinner"></span> Sync in progress...';
            document.getElementById('summaryContainer').style.display = 'grid';
            document.getElementById('logContainer').style.display = 'block';
            document.getElementById('logEntries').innerHTML = '';

            startTime = Date.now();
            timeInterval = setInterval(updateElapsedTime, 1000);

            addLogEntry('Starting Railway sync...');

            try {
                // Start sync
                const response = await fetch('/api/railway/sync', { method: 'POST' });
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to start sync');
                }

                syncId = data.sync_id;
                addLogEntry(`Sync started with ID: ${syncId}`);

                // Start polling for progress
                progressInterval = setInterval(checkProgress, 1000);

            } catch (error) {
                addLogEntry(`Error: ${error.message}`, true);
                document.getElementById('statusMessage').className = 'status-message status-error';
                document.getElementById('statusMessage').textContent = `Error: ${error.message}`;
                document.getElementById('startSync').disabled = false;
                document.getElementById('abortSync').disabled = true;
                clearInterval(timeInterval);
            }
        }

        async function checkProgress() {
            if (!syncId) return;

            try {
                const response = await fetch(`/api/railway/sync-progress/${syncId}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                // Update table rows with latest results
                if (data.all_results) {
                    Object.entries(data.all_results).forEach(([table, result]) => {
                        updateTableRow(table, result);
                    });
                    updateSummary(data.all_results);
                }

                // Process new updates
                if (data.updates && data.updates.length > 0) {
                    data.updates.forEach(update => {
                        if (update.table) {
                            if (update.status === 'error') {
                                addLogEntry(`[${update.table}] ERROR: ${update.message}`, true);
                            } else {
                                addLogEntry(`[${update.table}] ${update.message}`);
                            }
                        }
                    });
                }

                // Check if complete
                if (data.status === 'complete') {
                    clearInterval(progressInterval);
                    clearInterval(timeInterval);
                    progressInterval = null;
                    syncId = null;

                    document.getElementById('statusMessage').className = 'status-message status-success';
                    document.getElementById('statusMessage').textContent =
                        `✓ Sync complete! ${data.tables_synced}/${data.total_tables} tables synced successfully.`;
                    document.getElementById('startSync').disabled = false;
                    document.getElementById('abortSync').disabled = true;

                    addLogEntry(`Sync completed: ${data.tables_synced}/${data.total_tables} tables synced`);

                } else if (data.status === 'error') {
                    clearInterval(progressInterval);
                    clearInterval(timeInterval);
                    progressInterval = null;
                    syncId = null;

                    document.getElementById('statusMessage').className = 'status-message status-error';
                    document.getElementById('statusMessage').textContent = `✗ Sync failed: ${data.error}`;
                    document.getElementById('startSync').disabled = false;
                    document.getElementById('abortSync').disabled = true;

                    addLogEntry(`Sync failed: ${data.error}`, true);
                }

            } catch (error) {
                console.error('Progress check error:', error);
                // Don't stop checking, just log the error
                addLogEntry(`Progress check error: ${error.message}`, true);
            }
        }

        function abortSync() {
            if (confirm('Are you sure you want to abort the sync?')) {
                clearInterval(progressInterval);
                clearInterval(timeInterval);
                progressInterval = null;
                syncId = null;

                document.getElementById('statusMessage').className = 'status-message status-error';
                document.getElementById('statusMessage').textContent = 'Sync aborted by user';
                document.getElementById('startSync').disabled = false;
                document.getElementById('abortSync').disabled = true;

                addLogEntry('Sync aborted by user', true);
            }
        }

        // Initialize on page load
        initializeTable();
    </script>
</body>
</html>
