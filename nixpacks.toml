[variables]
NIXPACKS_NO_CACHE = "1"

[phases.setup]
nixPkgs = ["nodejs_18", "python311", "python311Packages.pip"]

[phases.build]
cmds = [
  "chmod +x build.sh",
  "./build.sh",
  "python -m venv venv",
  ". venv/bin/activate && pip install -r requirements.txt",
  "chmod +x start.sh"
]

[start]
cmd = ". venv/bin/activate && python src/app.py"
